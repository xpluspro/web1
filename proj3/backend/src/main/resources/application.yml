spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/bookstore_hw4?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET:bookstore-hw4-local-development-jwt-secret-key-change-me-please}
    expiration-millis: ${JWT_EXPIRATION_MILLIS:86400000}
