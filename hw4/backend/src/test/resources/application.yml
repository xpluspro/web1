spring:
  datasource:
    url: jdbc:h2:mem:hw4;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always

app:
  cors:
    allowed-origins: http://localhost:5173
